[package]
name = "evepi-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "evepi-server"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }

# MCP server
rmcp = { version = "0.1", features = ["server", "transport-io"] }
schemars = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Token storage
keyring = { version = "3", features = ["tokio"] }
age = { version = "0.10", features = ["async"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
tokio-stream = "0.1"
futures-util = "0.3"
urlencoding = "2"

[dev-dependencies]
tokio-test = "0.4"

[features]
integration = []
